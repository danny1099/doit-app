<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#171717" />
    <title>Doit — Offline</title>
    <link rel="icon" href="/images/app-logo.svg" />
    <style>
      :root {
        color-scheme: light dark;
        --background: #ffffff;
        --foreground: #171717;
        --muted: #6b7280;
        --border: #e5e7eb;
        --accent: #171717;
        --accent-foreground: #ffffff;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --background: #0a0a0a;
          --foreground: #fafafa;
          --muted: #a1a1aa;
          --border: #27272a;
          --accent: #fafafa;
          --accent-foreground: #171717;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: var(--background);
        color: var(--foreground);
        font-family:
          ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      main {
        width: 100%;
        max-width: 380px;
        text-align: center;
      }

      .logo {
        width: 56px;
        height: 56px;
        margin: 0 auto 24px;
        display: block;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 22px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }

      p {
        margin: 0 0 28px;
        font-size: 14px;
        line-height: 1.6;
        color: var(--muted);
      }

      button {
        appearance: none;
        border: 1px solid transparent;
        border-radius: 12px;
        padding: 12px 20px;
        font-size: 14px;
        font-weight: 600;
        font-family: inherit;
        color: var(--accent-foreground);
        background: var(--accent);
        cursor: pointer;
        transition: opacity 0.15s ease;
      }

      button:hover {
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <main>
      <img class="logo" src="/images/app-logo.svg" alt="Doit" />
      <h1 id="title">You're offline</h1>
      <p id="message">
        Doit can't reach the network right now. Check your connection and try again.
      </p>
      <button id="retry" type="button" onclick="window.location.reload()">Try again</button>
    </main>
    <script>
      if (navigator.language && navigator.language.toLowerCase().startsWith("es")) {
        document.documentElement.lang = "es";
        document.title = "Doit — Sin conexión";
        document.getElementById("title").textContent = "Estás sin conexión";
        document.getElementById("message").textContent =
          "Doit no puede conectarse a la red en este momento. Revisa tu conexión e inténtalo de nuevo.";
        document.getElementById("retry").textContent = "Reintentar";
      }
    </script>
  </body>
</html>
